name: Keep database warm

# Pings the app's health-check endpoint every 5 minutes (GitHub's shortest
# allowed schedule) so a free-tier Postgres host (Neon/Supabase) never
# goes long enough without a query to auto-suspend its compute — that
# suspend is what makes "every page takes long to load" happen on a
# low-traffic deployment (see src/app/api/health/route.ts). Runs
# automatically once this file is on the repo's default branch; nothing
# else to set up.
on:
  schedule:
    - cron: "*/5 * * * *"
  # Lets it be triggered by hand from the Actions tab too, e.g. to verify
  # it works right after adding it instead of waiting for the next tick.
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        run: curl -fsS --max-time 15 https://wanderer-s-rest.vercel.app/api/health
